name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    # Run after GoReleaser has created the release for the tag, then append the
    # Linux artifact to it. Running both jobs in parallel raced to create the
    # same tagged release and intermittently failed with "tag_name already_exists".
    needs: release-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Build
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          CGO_ENABLED=1 go build -ldflags="-s -w -X main.version=${VERSION}" -trimpath -o claude-monitor-lite
          tar -czvf claude-monitor-lite_Linux_x86_64.tar.gz claude-monitor-lite
          sha256sum claude-monitor-lite_Linux_x86_64.tar.gz > linux_checksums.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            claude-monitor-lite_Linux_x86_64.tar.gz
            linux_checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  release-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
