version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'typo'

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

homebrew_casks:
  - repository:
      owner: wickes1
      name: homebrew-tap
      # Pushed over SSH with a deploy key that can write to the tap and nothing else; a personal token expires.
      git:
        url: git@github.com:wickes1/homebrew-tap.git
        private_key: "{{ .Env.TAP_DEPLOY_KEY }}"
    directory: Casks
    homepage: https://github.com/wickes1/claude-monitor-lite
    description: "Lightweight menu bar monitor for Claude usage"
    license: MIT
    hooks:
      post:
        # Steps form (GoReleaser >= 2.19): Homebrew deprecated the Ruby `postflight do` block that `install` writes.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/claude-monitor-lite"]
          end
